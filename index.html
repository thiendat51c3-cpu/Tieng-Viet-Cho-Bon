<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d8f0ff" />
    <meta
      name="description"
      content="Bé Học Chữ Số: ứng dụng web miễn phí giúp bé mầm non học số, chữ cái, màu sắc và hình khối qua các trò chơi có giọng đọc tiếng Việt."
    />
    <title>Bé Học Chữ Số</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app">
      <section id="home" class="view"></section>
      <section id="game" class="view" hidden></section>
      <section id="result" class="view" hidden></section>
      <section id="album" class="view" hidden></section>
      <section id="parent" class="view" hidden></section>
      <section id="learn" class="view" hidden></section>
    </main>
    <div id="gate" class="overlay" hidden></div>
    <div id="rest" class="overlay" hidden></div>
    <div id="fx" aria-hidden="true"></div>

    <noscript>
      <p style="padding: 24px; font-size: 1.2rem">
        Vui lòng bật JavaScript để bé có thể chơi nhé.
      </p>
    </noscript>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
